    <section class="page-heading">
      <p class="mono">05 / Test drive</p>
      <h1>Take the<br><span class="red">next turn.</span></h1>
      <p>Tell us what you would like to drive. This demo form does not send your details.</p>
    </section>
    <section class="contact-content">
      <form id="form" class="form" novalidate>
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Model<select name="model" id="f-model" required>
          <option value="" selected disabled>Select a model</option>
          <option>Vento V12</option>
          <option>Ferrari F40</option>
          <option>Ferrari La Ferrari</option>
        </select></label>
        <label>Message<textarea name="msg" rows="3"></textarea></label>
        <button class="pill solid mag" type="submit">Send request</button>
        <p id="f-status" class="mono" role="status" aria-live="polite"></p>
      </form>
    </section>
